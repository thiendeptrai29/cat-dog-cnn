<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Nhận diện mèo và chó bằng CNN</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
  <h1>🐱🐶 Nhận diện mèo và chó bằng CNN</h1>

  <p>Upload ảnh để AI dự đoán.</p>

  <form action="/predict" method="POST" enctype="multipart/form-data">
    <input type="file" name="file" required>
    <button type="submit">Predict</button>
  </form>

  {% if prediction %}
    <div class="result">
      <h2>{{ prediction }}</h2>
      <img src="{{ image_path }}" width="300">
    </div>
  {% endif %}

</div>

</body>
</html>
